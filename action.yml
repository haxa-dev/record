name: Haxa
description: "Ask Haxa to film what a pull request changes, and to test it, when your workflow says so."
author: Haxa
branding:
  icon: film
  color: purple

inputs:
  pipeline:
    description: "What to run on the pull request: `demo`, `qa` or `both`."
    default: both
  wait:
    description: "Wait for the runs to end, and give their pages to later steps."
    default: "false"
  dry-run:
    description: "Say what would start, and start nothing."
    default: "false"
  pull-request:
    description: "The pull request's number, for a workflow on an event that names none, such as `workflow_run` after CI."
    default: ""
  server:
    description: "The Haxa to ask."
    default: https://haxa.dev

outputs:
  run-urls:
    description: "The runs' pages, as a JSON array."
    value: ${{ steps.haxa.outputs.run-urls }}

runs:
  using: composite
  steps:
    - id: haxa
      shell: bash
      # Inputs reach the script only as variables, so none of them is ever read as shell.
      env:
        HAXA_PIPELINE: ${{ inputs.pipeline }}
        HAXA_WAIT: ${{ inputs.wait }}
        HAXA_DRY_RUN: ${{ inputs.dry-run }}
        HAXA_PULL_REQUEST: ${{ inputs.pull-request }}
        HAXA_SERVER: ${{ inputs.server }}
      run: '"$GITHUB_ACTION_PATH/record.sh"'
